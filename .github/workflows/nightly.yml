# Nightly validation (02:00 UTC) and on demand: the full test suite, every engine on the shared vectors,
# every port against the Python monitor, and a replay of 30 minutes of synthetic traffic through the
# engine with a burst that must reach the reset level. Reports only; changes nothing.
name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1, read 2026-10-08
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, read 2026-10-08
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0, read 2026-10-09
        with:
          go-version: '1.24'
          cache: false
      - name: Install
        run: python -m pip install -e ".[jwt]" "pytest==8.3.3"
      - name: Tests
        run: python -m pytest -q
      - name: Vectors, all engines
        run: ports/conformance/run.sh
      - name: Every port against the Python monitor
        run: ports/conformance/interop.sh
      - name: 30 minutes of synthetic traffic with a burst
        run: |
          sf-smartwatch synth --agents 12 --seconds 1800 --rate 1 --burst 900,960,6,150 --seed 7 --out /tmp/traffic.jsonl
          sf-smartwatch replay /tmp/traffic.jsonl --out /tmp/windows.jsonl 2> /tmp/summary.txt
          cat /tmp/summary.txt
          grep -q 'reset due' /tmp/summary.txt
      - name: Benchmark (printed, not judged)
        run: sf-smartwatch bench --events 200000
