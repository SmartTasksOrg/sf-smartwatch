[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartwatch"
version = "0.1.0"
description = "Coupling-density monitor for multi-agent systems: measures how densely agents talk to each other, raises graded alerts, and proposes or issues resets before coordination outgrows human oversight."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartwatch", "agents", "multi-agent", "monitoring", "coupling", "oversight"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
jwt = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartwatch"
Issues = "https://github.com/SmartTasksOrg/sf-smartwatch/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartwatch/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartwatch/blob/main/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartwatch = "sf_smartwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartwatch = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
